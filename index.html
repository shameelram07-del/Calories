<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root{
    --ink:#12101F;
    --raise:#1D1930;
    --raise2:#262040;
    --line:#332B52;
    --dim:#8D86AE;
    --text:#EAE7F5;
    --band:#5BD6B0;
    --over:#E8734A;
    --gold:#E9B84C;
    --r:14px;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  .dp{
    font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
    color:var(--text);
    background:var(--ink);
    padding:20px 16px 40px;
    max-width:560px;
    margin:0 auto;
    border-radius:18px;
  }

  .dp-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px}
  .dp-title{
    font-family:'Archivo',sans-serif;font-weight:700;font-size:15px;
    letter-spacing:.16em;text-transform:uppercase;margin:0;
  }
  .dp-date{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim)}

  /* ---- signature: the landing band ---- */
  .meter{background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px 16px;margin-bottom:12px}
  .meter-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
  .big{
    font-family:'Archivo',sans-serif;font-weight:700;font-size:44px;line-height:.9;
    font-variant-numeric:tabular-nums;
  }
  .big small{font-size:13px;font-weight:500;color:var(--dim);letter-spacing:.1em;display:block;margin-top:7px;text-transform:uppercase}
  .verdict{text-align:right;font-size:12.5px;line-height:1.45;color:var(--dim);max-width:47%}
  .verdict b{display:block;font-family:'Archivo',sans-serif;font-size:13px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:3px}
  .in b{color:var(--band)} .under b{color:var(--gold)} .over b{color:var(--over)}

  .track{position:relative;height:12px;background:var(--raise2);border-radius:6px;overflow:hidden}
  .zone{position:absolute;top:0;bottom:0;background:rgba(91,214,176,.17);border-left:1px solid rgba(91,214,176,.55);border-right:1px solid rgba(91,214,176,.55)}
  .fill{position:absolute;top:0;bottom:0;left:0;background:var(--dim);border-radius:6px;transition:width .5s cubic-bezier(.4,0,.2,1)}
  .fill.in{background:var(--band)} .fill.over{background:var(--over)}
  .scale{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--dim);margin-top:7px}

  .pro{background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:18px}
  .pro-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
  .pro-lab{font-family:'Archivo',sans-serif;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .pro-num{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
  .pro-num.hit{color:var(--band)}
  .ptrack{height:8px;background:var(--raise2);border-radius:4px;overflow:hidden}
  .pfill{height:100%;background:var(--gold);border-radius:4px;transition:width .5s cubic-bezier(.4,0,.2,1)}
  .pfill.hit{background:var(--band)}

  /* ---- add ---- */
  .add{display:flex;gap:9px;margin-bottom:20px}
  .btn{
    flex:1;font-family:'Archivo',sans-serif;font-weight:600;font-size:13px;letter-spacing:.07em;
    text-transform:uppercase;padding:15px 10px;border-radius:var(--r);cursor:pointer;
    border:1px solid var(--line);background:var(--raise);color:var(--text);transition:.15s;
  }
  .btn:hover:not(:disabled){background:var(--raise2)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.key{background:var(--text);color:var(--ink);border-color:var(--text)}
  .btn.key:hover:not(:disabled){background:#fff}
  .btn:focus-visible{outline:2px solid var(--band);outline-offset:2px}
  input[type=file]{display:none}

  .status{
    background:var(--raise);border:1px solid var(--line);border-radius:var(--r);
    padding:14px 16px;margin-bottom:14px;font-size:13.5px;color:var(--dim);
    display:flex;align-items:center;gap:11px;
  }
  .spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--band);border-radius:50%;animation:sp .7s linear infinite;flex:0 0 auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}.fill,.pfill{transition:none}}
  .status.err{color:var(--over);border-color:rgba(232,115,74,.4)}

  /* ---- log ---- */
  .log-lab{font-family:'Archivo',sans-serif;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 10px 2px}
  .item{
    display:flex;gap:13px;align-items:flex-start;
    background:var(--raise);border:1px solid var(--line);border-radius:var(--r);
    padding:13px 14px;margin-bottom:8px;
  }
  .thumb{width:44px;height:44px;border-radius:9px;object-fit:cover;flex:0 0 auto;background:var(--raise2)}
  .no-thumb{width:44px;height:44px;border-radius:9px;flex:0 0 auto;background:var(--raise2);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim)}
  .item-body{flex:1;min-width:0}
  .item-name{font-size:14.5px;font-weight:500;margin-bottom:3px;line-height:1.3}
  .item-meta{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--dim)}
  .item-note{font-size:12px;color:var(--dim);margin-top:5px;line-height:1.45;font-style:italic}
  .del{background:none;border:none;color:var(--dim);font-size:19px;cursor:pointer;padding:0 3px;line-height:1;flex:0 0 auto}
  .del:hover{color:var(--over)}

  .empty{
    border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;
    font-size:13.5px;color:var(--dim);line-height:1.6;
  }

  .foot{margin-top:22px;font-size:11.5px;color:var(--dim);line-height:1.6;border-top:1px solid var(--line);padding-top:14px}
  .foot a{color:var(--dim);cursor:pointer;text-decoration:underline;text-underline-offset:2px}

  .sheet{background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:18px}
  .sheet h4{font-family:'Archivo',sans-serif;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 12px}
  .field{margin-bottom:11px}
  .field label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px}
  .field input{
    width:100%;background:var(--ink);border:1px solid var(--line);border-radius:9px;
    padding:11px 12px;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:14px;
  }
  .field input:focus{outline:none;border-color:var(--band)}
  .two{display:flex;gap:9px}.two .field{flex:1}
</style>

<div class="dp">
  <div class="dp-head">
    <h1 class="dp-title">Day Plate</h1>
    <span class="dp-date" id="date"></span>
  </div>

  <div class="meter">
    <div class="meter-top">
      <div class="big"><span id="kcal">0</span><small>calories today</small></div>
      <div class="verdict" id="verdict"><b>Nothing logged</b>Add your first meal</div>
    </div>
    <div class="track">
      <div class="zone" id="zone"></div>
      <div class="fill" id="fill" style="width:0%"></div>
    </div>
    <div class="scale"><span>0</span><span id="scaleMid"></span><span id="scaleMax"></span></div>
  </div>

  <div class="pro">
    <div class="pro-row">
      <span class="pro-lab">Protein</span>
      <span class="pro-num" id="pnum">0 / 150 g</span>
    </div>
    <div class="ptrack"><div class="pfill" id="pfill" style="width:0%"></div></div>
  </div>

  <div class="add">
    <button class="btn key" id="shot">Add photo</button>
    <button class="btn" id="manualBtn">Type it in</button>
  </div>
  <input type="file" id="file" accept="image/*">

  <div id="manual" style="display:none"></div>
  <div id="status" style="display:none"></div>

  <p class="log-lab">Logged</p>
  <div id="log"></div>

  <div class="foot">
    Estimates from a photo are rough — expect ±20%, more if the oil or portion is hidden. Good enough to spot patterns, not precise enough to argue with.
    <br><a id="reset">Clear today</a> · <a id="edit">Change targets</a>
  </div>
</div>

<script>
(function(){
  var S = { items: [], targets: {low:2000, high:2200, protein:150}, day: null };
  var mem = {};

  function today(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

  async function put(k,v){
    try{ if(window.storage) return await window.storage.set(k, JSON.stringify(v)); }catch(e){}
    mem[k]=JSON.stringify(v);
  }
  async function get(k){
    try{ if(window.storage){ var r=await window.storage.get(k); if(r&&r.value) return JSON.parse(r.value); } }catch(e){}
    return mem[k]?JSON.parse(mem[k]):null;
  }

  function save(){ put('dayplate:'+S.day, S.items); }
  function saveT(){ put('dayplate:targets', S.targets); }

  // ---- rendering ----
  function render(){
    var kcal = S.items.reduce(function(a,i){return a+i.kcal},0);
    var prot = S.items.reduce(function(a,i){return a+i.protein},0);
    var t = S.targets;
    var max = Math.max(t.high*1.35, kcal*1.08);

    document.getElementById('kcal').textContent = kcal.toLocaleString();
    document.getElementById('scaleMid').textContent = t.low.toLocaleString()+'–'+t.high.toLocaleString();
    document.getElementById('scaleMax').textContent = Math.round(max).toLocaleString();

    var z = document.getElementById('zone');
    z.style.left = (t.low/max*100)+'%';
    z.style.width = ((t.high-t.low)/max*100)+'%';

    var f = document.getElementById('fill');
    f.style.width = Math.min(100, kcal/max*100)+'%';
    f.className = 'fill' + (kcal>t.high?' over':(kcal>=t.low?' in':''));

    var v = document.getElementById('verdict');
    if(!S.items.length){ v.className='verdict'; v.innerHTML='<b>Nothing logged</b>Add your first meal'; }
    else if(kcal>t.high){ v.className='verdict over'; v.innerHTML='<b>'+(kcal-t.high).toLocaleString()+' over</b>Not a write-off. Just note it.'; }
    else if(kcal>=t.low){ v.className='verdict in'; v.innerHTML='<b>In the band</b>This is the day you want'; }
    else { v.className='verdict under'; v.innerHTML='<b>'+(t.low-kcal).toLocaleString()+' to go</b>Room left before the band'; }

    var pn = document.getElementById('pnum'), pf = document.getElementById('pfill');
    pn.textContent = Math.round(prot)+' / '+t.protein+' g';
    pn.className = 'pro-num' + (prot>=t.protein?' hit':'');
    pf.style.width = Math.min(100, prot/t.protein*100)+'%';
    pf.className = 'pfill' + (prot>=t.protein?' hit':'');

    var log = document.getElementById('log');
    if(!S.items.length){
      log.innerHTML = '<div class="empty">Photograph a meal and it gets estimated and added here.<br>Do it for two weeks without changing how you eat.</div>';
      return;
    }
    log.innerHTML = '';
    S.items.forEach(function(it,ix){
      var d = document.createElement('div'); d.className='item';
      d.innerHTML =
        (it.thumb ? '<img class="thumb" src="'+it.thumb+'" alt="">' : '<div class="no-thumb">TYPED</div>') +
        '<div class="item-body"><div class="item-name">'+esc(it.name)+'</div>'+
        '<div class="item-meta">'+it.kcal+' kcal · '+Math.round(it.protein)+'g protein · '+it.time+'</div>'+
        (it.note?'<div class="item-note">'+esc(it.note)+'</div>':'')+'</div>'+
        '<button class="del" aria-label="Remove '+esc(it.name)+'">×</button>';
      d.querySelector('.del').onclick = function(){ S.items.splice(ix,1); save(); render(); };
      log.appendChild(d);
    });
  }

  function esc(s){ var e=document.createElement('div'); e.textContent=s||''; return e.innerHTML; }

  function status(msg, isErr, spin){
    var el = document.getElementById('status');
    if(!msg){ el.style.display='none'; return; }
    el.style.display='flex';
    el.className = 'status'+(isErr?' err':'');
    el.innerHTML = (spin?'<div class="spin"></div>':'') + '<span>'+esc(msg)+'</span>';
  }

  function nowTime(){ var d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

  // ---- photo pipeline ----
  function shrink(file){
    return new Promise(function(res,rej){
      var img = new Image();
      img.onload = function(){
        var max=1024, w=img.width, h=img.height;
        if(w>h && w>max){ h=h*max/w; w=max; } else if(h>max){ w=w*max/h; h=max; }
        var c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        var full = c.toDataURL('image/jpeg',.8);
        var tc=document.createElement('canvas'); tc.width=132; tc.height=132;
        var s=Math.min(img.width,img.height);
        tc.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,132,132);
        res({ b64: full.split(',')[1], thumb: tc.toDataURL('image/jpeg',.6) });
      };
      img.onerror = function(){ rej(new Error('Could not read that image')); };
      img.src = URL.createObjectURL(file);
    });
  }

  var PROMPT = "You are estimating the calorie and protein content of a meal from a photo, for a 172cm male in his 20s doing a slow fat-loss phase alongside heavy training.\n\nContext that matters for accuracy: he eats Fijian Indian home cooking. It is mild, not heavily spiced, and cooked with very little oil. Curry is uncommon. Typical meals are rice or roti with chicken, lamb or fish and vegetables, usually in a 400-500ml container. Do not assume ghee-heavy or oil-heavy preparation unless the photo clearly shows it (visible oil pooling, glossy sheen, deep-fried texture).\n\nEstimate the whole portion visible. Use containers, cutlery and hands for scale where present.\n\nRespond with ONLY a JSON object, no markdown fences and no preamble:\n{\"name\":\"short plain name of the meal, max 6 words\",\"kcal\":number,\"protein\":number,\"note\":\"one short sentence, max 18 words: the main thing driving the number, or what you could not see\"}\n\nIf the photo contains no food at all, return {\"name\":\"No food found\",\"kcal\":0,\"protein\":0,\"note\":\"That photo does not show a meal.\"}";

  async function analyse(file){
    document.getElementById('shot').disabled = true;
    status('Reading the photo…', false, true);
    try{
      var img = await shrink(file);
      status('Estimating portion and protein…', false, true);

      var r = await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          model:"claude-sonnet-4-6", max_tokens:1000,
          messages:[{role:"user",content:[
            {type:"image",source:{type:"base64",media_type:"image/jpeg",data:img.b64}},
            {type:"text",text:PROMPT}
          ]}]
        })
      });
      if(!r.ok) throw new Error('Request failed ('+r.status+'). Try again.');
      var data = await r.json();
      var txt = data.content.filter(function(b){return b.type==='text'}).map(function(b){return b.text}).join('');
      var clean = txt.replace(/```json/g,'').replace(/```/g,'').trim();
      var m = clean.match(/\{[\s\S]*\}/);
      var out = JSON.parse(m ? m[0] : clean);

      if(!out.kcal && out.name === 'No food found'){ status(out.note || 'No food in that photo.', true); }
      else{
        S.items.push({ name:out.name, kcal:Math.round(out.kcal)||0, protein:Math.round(out.protein)||0, note:out.note||'', time:nowTime(), thumb:img.thumb });
        save(); render(); status('');
      }
    }catch(e){
      status(e.message || 'Something went wrong reading that photo.', true);
    }
    document.getElementById('shot').disabled = false;
  }

  // ---- manual entry ----
  function manualForm(){
    var w = document.getElementById('manual');
    if(w.style.display === 'block'){ w.style.display='none'; return; }
    w.style.display = 'block';
    w.innerHTML =
      '<div class="sheet"><h4>Type it in</h4>'+
      '<div class="field"><label>What was it</label><input id="mN" placeholder="Chocolate bar"></div>'+
      '<div class="two"><div class="field"><label>Calories</label><input id="mK" type="number" inputmode="numeric" placeholder="250"></div>'+
      '<div class="field"><label>Protein (g)</label><input id="mP" type="number" inputmode="numeric" placeholder="4"></div></div>'+
      '<button class="btn key" id="mAdd" style="width:100%">Add to today</button></div>';
    document.getElementById('mAdd').onclick = function(){
      var n=document.getElementById('mN').value.trim(), k=+document.getElementById('mK').value, p=+document.getElementById('mP').value;
      if(!n || !k){ status('Needs a name and a calorie figure.', true); return; }
      S.items.push({name:n, kcal:Math.round(k), protein:Math.round(p)||0, note:'', time:nowTime(), thumb:null});
      save(); render(); status(''); w.style.display='none';
    };
  }

  function targetForm(){
    var w = document.getElementById('manual');
    w.style.display = 'block';
    w.innerHTML =
      '<div class="sheet"><h4>Targets</h4>'+
      '<div class="two"><div class="field"><label>Band low</label><input id="tL" type="number" value="'+S.targets.low+'"></div>'+
      '<div class="field"><label>Band high</label><input id="tH" type="number" value="'+S.targets.high+'"></div></div>'+
      '<div class="field"><label>Protein floor (g)</label><input id="tP" type="number" value="'+S.targets.protein+'"></div>'+
      '<button class="btn key" id="tSave" style="width:100%">Save targets</button></div>';
    document.getElementById('tSave').onclick = function(){
      S.targets = { low:+document.getElementById('tL').value||2000, high:+document.getElementById('tH').value||2200, protein:+document.getElementById('tP').value||150 };
      saveT(); render(); w.style.display='none';
    };
  }

  // ---- wire up ----
  document.getElementById('shot').onclick = function(){ document.getElementById('file').click(); };
  document.getElementById('file').onchange = function(e){ if(e.target.files[0]) analyse(e.target.files[0]); e.target.value=''; };
  document.getElementById('manualBtn').onclick = manualForm;
  document.getElementById('edit').onclick = targetForm;
  document.getElementById('reset').onclick = function(){ S.items=[]; save(); render(); status(''); };

  (async function init(){
    S.day = today();
    document.getElementById('date').textContent = new Date().toLocaleDateString('en-NZ',{weekday:'short',day:'numeric',month:'short'});
    var t = await get('dayplate:targets'); if(t) S.targets = t;
    var i = await get('dayplate:'+S.day); if(i) S.items = i;
    render();
  })();
})();
</script>
